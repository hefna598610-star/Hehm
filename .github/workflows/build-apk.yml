name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | awk -F '.' '{print $1}')
          if [ -z "$JAVA_MAJOR" ]; then
            echo "Error: Unable to detect Java version."
            exit 1
          fi
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Java major version must be 17 or higher. Found: $JAVA_MAJOR"
            exit 1
          fi
          echo "Java environment verified successfully."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            echo "Generating temporary debug keystore..."
            keytool -genkeypair \
              -alias androiddebugkey \
              -keypass android \
              -keystore ./debug.keystore \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          else
            echo "Debug keystore already exists."
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: Failed to create ./debug.keystore"
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          APK_FILE="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_FILE" ]; then
            echo "Error: Expected APK file not found at $APK_FILE"
            echo "Searching only inside app/build/outputs/apk:"
            find app/build/outputs/apk -maxdepth 4 -name "*.apk" 2>/dev/null || true
            exit 1
          fi
          if [ ! -s "$APK_FILE" ]; then
            echo "Error: APK file $APK_FILE is empty."
            exit 1
          fi
          case "$APK_FILE" in
            *.apk) ;;
            *) echo "Error: File does not have .apk extension."; exit 1 ;;
          esac
          echo "Verified APK successfully: $APK_FILE ($(wc -c < "$APK_FILE") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TMP_DIR=$(mktemp -d -t apk-release-XXXXXX)
          cp "app/build/outputs/apk/debug/app-debug.apk" "$TMP_DIR/app-debug.apk"
          if [ ! -f "$TMP_DIR/app-debug.apk" ] || [ ! -s "$TMP_DIR/app-debug.apk" ]; then
            echo "Error: Failed to prepare release asset."
            exit 1
          fi
          echo "asset_dir=$TMP_DIR" >> "$GITHUB_OUTPUT"
          echo "asset_path=$TMP_DIR/app-debug.apk" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $TMP_DIR/app-debug.apk"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Verifying GitHub CLI ==="
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ]; then
            echo "Error: Prepared APK asset does not exist at $ASSET_PATH"
            exit 1
          fi
          if [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Prepared APK asset is empty."
            exit 1
          fi
          ASSET_NAME=$(basename "$ASSET_PATH")
          if [ "$ASSET_NAME" != "app-debug.apk" ]; then
            echo "Error: Asset name must be exactly app-debug.apk. Found: $ASSET_NAME"
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          cat << 'EOF' > release_notes.md
          ### MagnoScan Debug Build

          - **Type:** Automatically generated debug APK
          - **Builder:** GitHub Actions
          - **Run Number:** ${{ github.run_number }}
          - **Run Attempt:** ${{ github.run_attempt }}
          - **Commit SHA:** ${{ github.sha }}
          - **Notice:** This APK is intended for testing only and is not a Play Store production release.
          - **Signing:** Signed only with a temporary debug keystore.
          EOF

          echo "Creating release with tag: $RELEASE_TAG"
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE" \
            --notes-file release_notes.md \
            --latest

          rm -f release_notes.md
          echo "Release created successfully."

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
            DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"

            echo "=== Release Information ==="
            gh release view "$RELEASE_TAG" || true
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release Asset: app-debug.apk"
            echo "Direct APK Download URL: $DIRECT_URL"

            cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ## DIRECT APK DOWNLOAD
          - **Latest Direct Download URL:** [app-debug.apk]($DIRECT_URL)
          - **Release Tag:** \`$RELEASE_TAG\`
          - **Release Title:** $RELEASE_TITLE
          - **Asset Name:** \`app-debug.apk\`

          > Note: The standard GitHub Actions backup artifact \`app-debug-apk\` remains available under this workflow run.
          EOF
          else
            echo "::warning::GitHub Release publishing failed or was skipped. However, if the build succeeded, the GitHub Actions artifact 'app-debug-apk' remains available for download."
            cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ## Build Result Notice
          - Release publishing encountered an issue or was skipped.
          - If the debug build succeeded, the backup artifact \`app-debug-apk\` remains available on this workflow summary page.
          EOF
          fi
